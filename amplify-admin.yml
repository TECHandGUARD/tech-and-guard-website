version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - npm ci
    build:
      commands:
        - npm run build:admin
  artifacts:
    baseDirectory: apps/admin/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

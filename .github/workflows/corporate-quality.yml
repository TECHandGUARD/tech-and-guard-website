name: Corporate website quality gates

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/corporate-quality.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: corporate-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Unit and API regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Ensure generated pages exist
        run: |
          test -f dist/index.html
          test -f dist/services/index.html
          test -f dist/projects/index.html
          test -f dist/about/index.html
          test -f dist/store/index.html
          test -f dist/contact/index.html
          test -f dist/account/index.html
          test -f dist/admin/index.html
          test -f dist/design-themes/index.html
          test -f dist/store-themes/index.html

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build isolated browser fixture
        env:
          VITE_STORE_ENV: staging
          VITE_STORE_URL: https://themebrowserfixture.supabase.co
          VITE_STORE_PUBLIC_KEY: sb_publishable_themebrowserfixture
        run: npm run build
      - name: Install Chromium headless shell
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps --only-shell chromium
      - name: Verify design gallery and project enquiries
        run: python tests/theme-browser.py
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theme-browser-traces
          path: browser-test-results/
          if-no-files-found: ignore
